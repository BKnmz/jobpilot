[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.2.0"
description = "Local job application pipeline: scrape, score with AI, tailor your CV, export .docx"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.50.0",
    "playwright>=1.44.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
drive = ["gdown>=5.1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["jobpilot*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser end-to-end tests (need JOBPILOT_E2E=1, Playwright and a browser)"]
